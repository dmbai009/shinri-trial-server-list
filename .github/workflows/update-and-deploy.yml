name: Update servers and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

# Serialize queries, the generated snapshot branch, and Pages deployments.
concurrency:
  group: server-browser-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --omit=dev
      - run: npm run validate && npm test
      - name: Restore last known statistics
        run: node scripts/snapshot-store.mjs restore
      - name: Query game servers
        run: npm run collect
      - name: Persist snapshot separately from source configuration
        run: node scripts/snapshot-store.mjs save
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
